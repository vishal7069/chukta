name: Verify Chukta
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm test
        working-directory: server
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :androidApp:assembleDebug :shared:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: chukta-android-debug
          path: androidApp/app/build/outputs/apk/debug/androidApp-debug.apk
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: iosApp
      - run: xcodebuild -project iosApp/Chukta.xcodeproj -scheme Chukta -sdk iphonesimulator -configuration Debug ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
